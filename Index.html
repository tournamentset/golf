<!DOCTYPE html>
<html><head><base target="_top"><meta charset="utf-8">
<style>
:root{--ink:#15251c;--fw:#1e5b3a;--pin:#c23b2e;--bg:#f2f5f0;--ln:#d3dacf}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--fw);color:#fff;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between}
header b{font:700 20px Georgia,serif}
header small{font:400 11px system-ui,sans-serif;opacity:.85;margin-left:4px}
select,input,button{font:inherit;padding:10px;border:1px solid var(--ln);border-radius:6px;background:#fff;color:var(--ink);max-width:100%}
input:disabled{background:#e6ece3;color:#55665b}
input[type=checkbox]{width:22px;height:22px;padding:0}
nav{display:flex;background:#fff;border-bottom:2px solid var(--fw)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:12px 4px;font-size:14px;cursor:pointer}
nav button.on{background:var(--fw);color:#fff}
main{max-width:760px;margin:0 auto;padding:12px}
section{display:none}
h3{font:700 19px Georgia,serif;margin:18px 0 6px}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--ln)}
td,th{padding:8px;border-bottom:1px solid var(--ln);text-align:left}
th{font-size:13px;font-weight:600;background:#e6ece3}
td.n{font:700 18px Georgia,serif;text-align:right;white-space:nowrap}
.u{color:var(--pin)}
.e{color:#1b8a3c;font-weight:700}
.m{color:#55665b;font-size:14px;margin:4px 0}
.lk{text-decoration:underline;cursor:pointer}
.r{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:8px 0}
.r input{width:110px;text-align:center;font:700 22px Georgia,serif}
.r select{flex:1}
.bar{display:flex;justify-content:space-between;align-items:center;margin:12px 0}
.bar b{font:700 24px Georgia,serif}
button.pri{width:100%;background:var(--fw);color:#fff;border:0;font-weight:600;margin-top:10px}
button.bad{background:var(--pin);color:#fff;border:0}
button.sel{background:var(--fw);color:#fff;border:0}
button.c{padding:1px 7px;font-size:11px;border-radius:4px;line-height:1.5;margin-left:6px;vertical-align:middle}
.f{display:grid;gap:8px}
.rs{font-weight:600;background:#e6ece3;padding:8px;border-radius:6px;margin:6px 0;white-space:pre-line;text-align:center}
.w{display:flex;align-items:center;gap:6px}
.df{width:34px;font-size:12px;color:#55665b}
.box{display:block;width:fit-content;margin:8px auto;padding:8px 20px;border-radius:12px;color:#fff;font:700 20px system-ui,sans-serif;text-align:center}
.gr{background:#1b8a3c}
.rd{background:#c23b2e}
.bl{background:#2563c9}
.mx{display:none;gap:8px;margin:0 0 10px;padding:8px;background:#e6ece3;border-radius:6px}
.mx .r input{width:auto;flex:1;font:inherit;text-align:left}
.pn{font-size:18px}
.pen{background:#fff3cd;color:#7a5b00;border:1px solid #f0d58a;border-radius:8px;padding:6px 10px;margin:6px 0;font-size:14px;text-align:center}
.warn{background:#fdecea;color:#8a1f14;border:1px solid #f3b5ae;border-radius:8px;padding:8px 10px;margin:10px 0;font-size:14px}
#pt button.pri{padding:14px;font-size:18px;letter-spacing:.5px}
#pt button.gris{background:#55665b;padding:10px;font-size:15px;letter-spacing:0}
#md textarea{width:100%;height:280px;font:14px/1.4 system-ui,sans-serif;padding:10px;border:1px solid var(--ln);border-radius:6px;background:#fff;color:var(--ink)}
#md>.tj{padding:10px}
.tj h3{margin:2px 0 6px;font-size:17px}
.tj td,.tj th{padding:3px 8px;font-size:14px}
.tj td.n{font-size:16px}
.tj tr.tt td{border-top:2px solid var(--fw)}
.tj tr.sb td,.tq tr.sb td{border-bottom:2px solid var(--fw)}
.tj button.pri{margin-top:8px;padding:8px}
#md>.tqd{padding:10px}
table.tq{table-layout:fixed}
.tq th{padding:6px 2px;text-align:center;vertical-align:bottom}
.tq th:first-child{width:70px}
.tq th:last-child{width:54px}
.tq .vt{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;font-size:14px;display:inline-block}
.tq td{padding:3px 4px;text-align:center}
.tq td.h{font-weight:600;color:#55665b}
.tq td.n{font-size:17px;text-align:center}
.tq tr.tt td{border-top:2px solid var(--fw)}
.tq th.pbh{width:34px}
.tq td.pb{font-weight:700;font-size:13px;color:#1e5b3a}
.tq .gv{position:relative;display:inline-block}
.tq .as{position:absolute;left:100%;top:-3px;font-style:normal;font-size:15px;line-height:1}
#md>.sup{padding:12px}
.sup h3{margin:2px 0 6px}
.sup p{margin:4px 0}
.sup .m{font-size:13px;margin:2px 0}
.sup .rv{color:var(--pin);font-size:13px;margin:2px 0}
#md{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:flex-start;justify-content:center;overflow:auto;padding:12px}
#md>div{background:#fff;border-radius:8px;padding:14px;width:100%;max-width:520px}
</style></head><body>
<header><b>Golf<small>2.0</small></b><select id="f" onchange="chF()"></select></header>
<nav id="nv"><button onclick="show(0)">Armar equipo</button><button onclick="show(1)">Cargar Tarjeta</button><button onclick="show(2)">Leaderboard</button><button onclick="show(3)">Admin</button></nav>
<main>
<section id="s0"></section>
<section id="s1"><div id="lg" class="f"><select id="eq"></select><input id="cl" type="password" placeholder="Clave del equipo"><button class="pri" onclick="entrar($('eq').value,$('cl').value)">Entrar</button><p class="m">Equipos del sorteo: la primera clave que pongan queda guardada para todo el equipo.</p></div><div id="hh"></div></section>
<section id="s2"></section>
<section id="s3"><div class="f"><input id="pin" type="password" placeholder="PIN de administrador"><button class="pri" onclick="adm()">Entrar</button></div><div id="al"></div></section>
</main>
<div id="md" onclick="if(event.target==this)this.style.display='none'"></div>
<script>
var PV=false,F,J,CA=[],EQ,V=2,cur,T0,PINV='',SP=false,ADM=[],ORD=[],ORDK=null,JG=null,CF=null,TD=null,GF=0,RG=null,LB=null,PIND=false,CB=null,SLX=[],SLU='',SLSEL='0';
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function run(fn,a,ok,bad){var r=google.script.run.withSuccessHandler(ok||function(){}).withFailureHandler(bad||function(e){alert(e.message)});r[fn].apply(r,a)}
function fh(t){return t<0?'<span class="u">'+t+'</span>':t==0?'<span class="e">E</span>':'+'+t}
function fhT(t){return t<0?String(t):t==0?'E':'+'+t}
function sc(t){return fh(t)}
function money(x){return '$'+Math.round(x).toLocaleString('es-AR',{maximumFractionDigits:0})}
function fdt(f){f=String(f);var m=/~m(\d+)$/.exec(f);return f.slice(0,10).split('-').reverse().join('/')+(m?' · Match '+m[1]:'')}
/* desplegable de torneos: fecha y cancha (los match: fecha y número de match), ordenados por fecha */
function ordF(a){return a.sort(function(x,y){var p=x.f.slice(0,10),q=y.f.slice(0,10);return p<q?-1:p>q?1:((x.mt||0)-(y.mt||0))})}
function dot(n){var s=String(n).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();return /^azul/.test(s)?'🔵 ':/^blanc/.test(s)?'⚪ ':/^roj/.test(s)?'🔴 ':/^negr/.test(s)?'⚫ ':/^amarill/.test(s)?'🟡 ':/^verd/.test(s)?'🟢 ':/^naranj/.test(s)?'🟠 ':/^viol|^morad/.test(s)?'🟣 ':''}
function dotS(n){return dot(n).trim()||String(n||'')}
function recL(r){return r=='14'?'14 hoyos':r=='ida'?'9 de ida':r=='vuelta'?'9 de vuelta':'18 hoyos'}
function ls(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'null');if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function acc(){var s=ls('golf');return s&&cur&&s.f==cur.f?[s.eq,s.cl]:['','']}
function vis(i){var e=cur?cur.e:'ABIERTO';return i==0?e=='ABIERTO'&&!(cur&&cur.mt&&cur.arm)&&!(cur&&cur.td):i==1?e!='FINALIZADO':true}
function show(n){$('nv').children[0].textContent=cur&&cur.mt?'Armar partido':'Armar equipo';if(!vis(n))n=2;V=n;for(var i=0;i<4;i++){$('s'+i).style.display=i==n?'block':'none';var b=$('nv').children[i];b.style.display=vis(i)?'':'none';b.className=i==n?'on':''}
  if(n==1)cargar();if(n==2)pos();if(n==3&&PINV)adm()}
function fillF(sel){$('f').innerHTML=ordF(F).map(function(x){return'<option value="'+x.f+'"'+(x.f==sel?' selected':'')+'>'+(x.mt?fdt(x.f):fdt(x.f)+' · '+esc(x.cn||''))+'</option>'}).join('')}
function chF(){cur=F.filter(function(x){return x.f==$('f').value})[0];EQ=null;team();var s=ls('golf');show(s&&s.f==cur.f&&cur.e!='FINALIZADO'?1:2)}
run('getInit',[],function(d){F=ordF(d.f);GF=d.gf||0;J=d.j.sort(function(a,b){return a.a.localeCompare(b.a)});
  var s=F.filter(function(x){return x.f>=d.hoy})[0]||F[F.length-1];fillF(s.f);chF();
  setInterval(function(){if(V==2)pos();if(V==1&&EQ&&EQ.pres)refrescar(true)},20000);
  cSend()});

/* ---- Leaderboard ---- */
function tb(t,rows,cols,fn,ni,sub){if(!rows.length)return'';
  var h='<h3>'+t+'</h3>'+(sub||'')+'<table><tr>'+cols.map(function(c){return'<th>'+c+'</th>'}).join('')+(PV?'<th>Premio</th>':'')+'</tr>';
  rows.forEach(function(x,i){var c=fn(x,i);h+='<tr>'+c.map(function(v,k){return'<td'+(k==(ni==null?c.length-1:ni)?' class="n"':'')+'>'+v+'</td>'}).join('')+(PV?'<td>'+(x.p?money(x.p)+cu(x):'')+'</td>':'')+'</tr>'});
  return h+'</table>'}
/* lo que cobra cada jugador cuando el premio es de un equipo o de una pareja (si no es igual para todos, los dos importes) */
function cu(x){if(!x.pcs||x.pcs.length<2)return'';var u=[];x.pcs.forEach(function(v){if(u.indexOf(v)<0)u.push(v)});u.sort(function(a,b){return b-a});return'<div class="m">'+u.map(function(v){return money(v)}).join(' y ')+' c/u</div>'}
function pg(a){if(!a||!a.length)return'';return'<h3>Premios por jugador</h3><table>'+a.map(function(x){return'<tr><td>'+esc(x.a)+'</td><td class="n">$ '+Math.round(x.t).toLocaleString('es-AR',{maximumFractionDigits:0})+'</td></tr>'}).join('')+'</table>'}
function bolasLinea(d){var p=[[1,d.b1],[3,d.b3],[4,d.b4]].filter(function(x){return x[1]&&x[1].length}).map(function(x){return x[0]+(x[0]==1?' bola: ':' bolas: ')+'<b>'+x[1].join(' ')+'</b>'});
  return'<p class="m"><b>'+esc((d.cn?d.cn+' · ':'')+dotS(d.tee)+((d.rec=='ida'||d.rec=='vuelta')?' · '+recL(d.rec):''))+'</b>'+(p.length?' · '+p.join(' · '):'')+(d.pb?' · <b>Punto bonus</b>':'')+'</p>'}
/* Una tarjeta figura como finalizada (F) solo si está completa y el equipo la presentó; si no, se ve el último hoyo cargado.
   En los torneos finalizados alcanza con que esté completa (al finalizar se dan por presentadas).
   En los torneos restringidos, quien no está logueado ve el botón Login para entrar con su equipo y su clave */
function pos(){var a=acc();run('posiciones',[cur.f,a[0],a[1]],function(d){
  if(d.err){$('s2').innerHTML=esc(d.err);return}
  SP=d.e=='FINALIZADO';PV=SP&&!!d.vp;
  if(d.restr){$('s2').innerHTML='<p style="text-align:center;font:700 34px Georgia,serif;margin:48px 0 16px;color:var(--fw)">TORNEO EN CURSO</p><p class="m" style="text-align:center">'+(d.val?'Los resultados se ven cuando tu equipo presenta su tarjeta.':'Entrá con tu equipo y su clave para ver los resultados cuando presente su tarjeta.')+'</p>'
    +(d.val?'':'<button class="pri" onclick="lgV()">Login</button>')
    +(d.prog&&d.prog.length?'<div style="text-align:center;margin-top:16px">'+d.prog.map(function(x){return'<p class="m" style="font-size:16px">'+esc(x.eq)+' ('+(x.fin?'Finalizado':x.h?x.h:'-')+')</p>'}).join('')+'</div>':'');return}
  LB=d;
  if(d.mt){mPos(d);return}
  if(!d.n){$('s2').innerHTML='<p class="m">Todavía no hay equipos armados para esta fecha.</p>';return}
  var fi=function(x){return x.cp&&(SP||x.pr)};
  var med=function(x,i){var s=x.st=='F'?sc(x.vp)+'&nbsp;&nbsp;'+x.net+' <span class="m">('+x.g+' - '+x.hm+')</span>':x.st=='X'?'NPT':sc(x.vp)+' <span class="m">'+(x.lh==null?'':x.lh)+'</span>';
    return[i+1,'<span class="lk" onclick="tj(\''+x.m+'\')">'+esc(x.a)+'</span>'+(x.idx==null?'':' <span class="m">('+x.idx+')</span>')+(d.tee=='Mixto'&&x.tee?' '+dot(x.tee):''),s]};
  $('s2').innerHTML=''
   +tb('Laguneada '+d.hs+' hoyos de a '+d.jpe+' jugadores',d.lag,['Equipo','Total','Hoyo'],function(x,i){return['<span class="lk" onclick="tq(\'L\','+i+')">'+esc(x.eq)+'</span>',sc(x.t),fi(x)?'F':(x.lh||'')]},1,'<p class="m">'+d.n+(d.n==1?' Equipo inscripto':' Equipos inscriptos')+'</p>'+bolasLinea(d))
   +tb('Twosome',d.two,['Pareja','Total','Hoyo'],function(x,i){return['<span class="lk" onclick="tq(\'T\','+i+')">'+esc(x.pl)+'</span>',x.npt?'NPT':sc(x.t),fi(x)?'F':(x.lh||'')]},1)
   +tb(d.alta.length?'Medal individual · baja':'Medal individual',d.baja,['#','Jugador','Score'],med)
   +tb('Medal individual · alta',d.alta,['#','Jugador','Score'],med)+(PV?pg(d.pagos):'')
   +'<button class="pri" onclick="wa()">Copiar resultados para WhatsApp</button>'})}
/* Login del leaderboard (torneos restringidos): el compañero elige el equipo, escribe su clave y queda logueado en este celular */
function lgV(){run('listaEquipos',[cur.f],function(l){
  $('md').innerHTML='<div><h3>Login</h3><p class="m">Elegí tu equipo e ingresá su clave para ver los resultados.</p><div class="f"><select id="le">'+(l||[]).map(function(e){return'<option>'+esc(e)+'</option>'}).join('')+'</select><input id="lc" type="password" placeholder="Clave del equipo"><button class="pri" onclick="lgOk()">Entrar</button><button class="pri" style="background:#55665b" onclick="cerrarMd()">Cancelar</button></div></div>';$('md').style.display='flex'})}
function lgOk(){var eq=$('le').value,cl=$('lc').value;if(!cl){alert('Ingresá la clave del equipo');return}
  run('verificarEquipo',[cur.f,eq,cl],function(){ls('golf',{f:cur.f,eq:eq,cl:cl});cerrarMd();pos()})}
/* texto de resultados para pegar en WhatsApp: con el torneo finalizado, todos los que cobran (con sus premios) y la mención especial; mientras
   se juega, los 3 primeros de cada rubro */

/* ---- Leaderboard del match: "Vieguer 3 arriba al 8", "Vieguer - Ruiz E 16", "Vieguer 3 y 2", "Vieguer (Hoyo 20)" ---- */
/* en los match "arriba" se muestra con una flecha verde (en WhatsApp, con ⬆️) */
var SP3='&nbsp;&nbsp;&nbsp;';
var ARW='<svg width="13" height="15" viewBox="0 0 14 16" style="vertical-align:-2px;margin-left:2px"><path d="M7 0L14 8H9.5V16H4.5V8H0Z" fill="#1b8a3c"/></svg>';
function fl(s,txt){return txt?String(s).replace(/ arriba/g,' ⬆️'):esc(s).replace(/ arriba/g,ARW)}
/* "VIEGUER 3 arriba" de la tarjeta: 3 espacios entre el apellido y el resultado */
/* en la tarjeta del match los jugadores van con las 3 primeras letras del apellido (FER, GRI), así entra todo en el celular */
function ab3(n){return String(n).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase()}
function vaH(v,nm){for(var k=0;k<2;k++){var n=String(nm[k]).toUpperCase();if(v.indexOf(n+' ')==0)return ab3(nm[k])+SP3+fl(v.slice(n.length+1))}return fl(v)}
function mResH(m,txt){var nm=m.a,b=function(x){return txt?x:'<b>'+esc(x)+'</b>'};
  if(m.l!==null&&m.l!==undefined)return b(nm[m.l])+(txt?'   ':SP3)+fl(m.st,txt);
  if(m.emp)return txt?nm[0]+' - '+nm[1]+'  E  '+m.ult:esc(nm[0])+' - '+esc(nm[1])+'&nbsp;&nbsp;<span class="e">E</span>&nbsp;&nbsp;'+m.ult;
  return txt?nm[0]+' - '+nm[1]:esc(nm[0])+' - '+esc(nm[1])}
function mGol(m){return m.mod=='neto'&&m.rcv>=0?esc(m.a[m.rcv])+' recibe '+m.H+(m.H==1?' golpe':' golpes'):''}
var MT=[];
function mLista(d){return d.todos||[{f:cur.f,mt:d.mt,mod:d.mod,cn:d.cn,tee:d.tee,e:d.e,match:d.match}]}
function mPos(d){MT=mLista(d);
  var s='<h3>Match del '+fdt(cur.f).slice(0,10)+'</h3><table><tr><th>Match</th><th>Jugadores</th><th>Resultado</th></tr>';
  MT.forEach(function(x,i){var m=x.match;
    s+='<tr'+(x.f==cur.f?' style="background:#eef4ec"':'')+'><td><b>'+x.mt+'</b><div class="m">'+(x.mod=='neto'?'Neto':'Gross')+'<br>'+esc((x.cn?x.cn+' · ':'')+dotS(x.tee))+'</div></td>'
     +'<td>'+(m?'<span class="lk" onclick="tjM('+i+')">'+esc(m.a[0])+' - '+esc(m.a[1])+'</span>'+(mGol(m)?'<div class="m">'+mGol(m)+'</div>':''):'<span class="m">sin armar</span>')+'</td>'
     +'<td>'+(m?mResH(m)+(m.fin?' · <b>F</b>':''):'')+'</td></tr>'});
  $('s2').innerHTML=s+'</table><p class="m">Tocá los jugadores para ver la tarjeta.</p><button class="pri" onclick="wa()">Copiar resultados para WhatsApp</button>'}
/* tarjeta del match: los dos scores de cada hoyo y cómo va el match después de ese hoyo */
function tjM(i){var x=MT[i||0];if(!x)return;run('tarjetaMatch',[x.f],function(t){var nm=t.a,col=function(g,par){return typeof g=='number'?(g==par?'#1b8a3c':g>par?'#000':'#c23b2e'):''};
  var s='<h3>'+esc(nm[0])+' - '+esc(nm[1])+'</h3><p class="m">Match '+x.mt+' · '+(t.mod=='neto'?'Neto':'Gross')+(mGol(t)?' · '+mGol(t):'')+'</p><table><tr><th>Hoyo</th><th>Par</th><th style="text-align:center">'+ab3(nm[0])+'</th><th style="text-align:center">'+ab3(nm[1])+'</th><th>Match</th></tr>';
  t.rows.forEach(function(r){if(r.x)return;
    s+='<tr><td>'+r.lab+'</td><td>'+r.par+'</td>'+r.g.map(function(g,k){var c=col(g,r.par);return'<td class="n" style="text-align:center'+(c?';color:'+c:'')+'">'+(g==null?'':g=='NR'?'-':g)+(r.gp&&t.rcv==k&&g!=null?'<sup style="font-size:11px">•</sup>':'')+'</td>'}).join('')
      +'<td style="white-space:nowrap">'+(r.va=='E'?'<span class="e">E</span>':'<b>'+vaH(r.va,nm)+'</b>')+'</td></tr>'});
  s+='</table>'+(t.mod=='neto'&&t.rcv>=0?'<p class="m">• = hoyo con golpe</p>':'')+'<button class="pri" onclick="$(\'md\').style.display=\'none\'">Cerrar</button>';
  $('md').innerHTML='<div class="tj">'+s+'</div>';$('md').style.display='flex'})}
function wa(){var d=LB;if(!d||(!d.n&&!d.mt))return;
  if(d.mt){var mt='*Match · '+fdt(cur.f).slice(0,10)+'*\n';
    mLista(d).forEach(function(x){if(!x.match)return;mt+='\n*Match '+x.mt+'* · '+(x.mod=='neto'?'Neto':'Gross')+'\n'+mResH(x.match,true)+(x.match.fin?'':' (en juego)')+'\n'});
    $('md').innerHTML='<div><h3>Resultados para WhatsApp</h3><textarea id="wat" readonly>'+esc(mt)+'</textarea><button class="pri" onclick="copiarTxt(\'wat\',\'Copiado. Pegalo en WhatsApp.\')">Copiar</button><button class="pri" style="background:#55665b" onclick="cerrarMd()">Cerrar</button></div>';$('md').style.display='flex';return}
  var s='*Laguneada · '+fdt(cur.f)+'*\n'+(d.cn?d.cn+' · ':'')+dotS(d.tee)+((d.rec=='ida'||d.rec=='vuelta')?' · '+recL(d.rec):'')+'\n'+d.n+(d.n==1?' equipo':' equipos')+(SP?'':' · resultados parciales')+'\n';
  var rk=function(rows,x){if(x.s==null)return rows.indexOf(x)+1;for(var k=0;k<rows.length;k++)if(rows[k].s===x.s)return k+1;return rows.indexOf(x)+1};
  var sec=function(t,rows,fn){if(!rows||!rows.length)return'';var l=SP?rows.filter(function(x){return x.p}):rows.slice(0,3);if(!l.length)return'';
    var r='\n*'+t+'*\n';l.forEach(function(x){r+=rk(rows,x)+'. '+fn(x)+'\n'});return r};
  var cuT=function(x){if(!x.pcs||x.pcs.length<2)return'';var u=[];x.pcs.forEach(function(v){if(u.indexOf(v)<0)u.push(v)});u.sort(function(a,b){return b-a});return' ('+u.map(function(v){return money(v)}).join(' y ')+' c/u)'};
  var pz=function(x){return SP&&x.p?' · '+money(x.p)+cuT(x):''};

    var gm=el(function(x){return x.g},1,1),nm=el(function(x){return x.net},1,1),pr=el(function(x){return Math.abs(x.vp)},1,1),np=el(function(x){return x.net},-1,-1),gp=el(function(x){return x.g},-1,-1);
    s+='\n*Mención especial*\n🥇 '+gm.a+' ('+gm.g+' gross)\n🏌️‍♂️ '+nm.a+' ('+nm.net+' neto)\n🥱 '+pr.a+' ('+pr.net+' neto)\n🫣 '+np.a+' ('+np.net+' neto)\n🥵 '+gp.a+' ('+gp.g+' gross)\n'}

/* copia al portapapeles el texto de un cuadro (si el navegador no deja, queda seleccionado para copiarlo a mano) */

  t.h.forEach(function(x){if(typeof x.g=='number'){var o=sb[grp(x.h)];o.g+=x.g;o.p+=x.par;o.n++}});

/* tarjeta del equipo (laguneada) o de la pareja (twosome): hoyos hacia abajo, un renglón por hoyo, apellidos en vertical.

/* acumulado de la tarjeta en el orden en que se juega: si el equipo salió por el 10 y todavía no terminó, se cuenta desde el 10
   (10...18, 1, 2...). Con la tarjeta completa se cuenta desde el primer hoyo, empezando en 0 */
function acum(n,tiene,val){var st=[],all=true,i;for(i=0;i<n;i++){if(!tiene(i))all=false;if(tiene(i)&&!tiene((i-1+n)%n))st.push(i)}
  var s0=(!all&&st.length==1)?st[0]:0,out=[],ac=0;
  for(var k=0;k<n;k++){var j=(s0+k)%n,v=val(j);if(v!=null&&tiene(j)){ac+=v;out[j]=ac}else out[j]=null}
  return out}
function gs(h,hh,m){m=m||18;return h>=0?Math.floor(h/m)+(hh<=h%m?1:0):(hh>m+h?-1:0)}

/* ---- Match: uno contra uno. El de mayor index recibe golpe (neto) en los hoyos con handicap <= EQ.H. 99 = levantó pelota (pierde el hoyo).

function hn(h){return h>18?h-18:h}

    var n=[a,b];if(EQ.rcv>=0)n[EQ.rcv]-=gs(EQ.H,EQ.hcps[hn(h)-1],18);return n[0]<n[1]?0:n[1]<n[0]?1:2};
  var up=0,p=0,fin=false,res=null,po=0;
  for(var h=1;h<=18;h++){var w=gana(h);if(w!==null&&!fin){p++;up+=w===0?1:w===1?-1:0;if(Math.abs(up)>18-p){fin=true;res={l:up>0?0:1,up:Math.abs(up),rem:18-p}}}}
  if(!fin&&p==18&&up===0)for(var e=19;e<=36;e++){var w2=gana(e);if(w2===null){po=e;break}if(w2!==2){fin=true;res={l:w2,hoyo:e};break}}

function mExt(){var s=mEst();if(!s.fin&&s.po&&EQ.hs.indexOf(s.po)<0){EQ.hs.push(s.po);EQ.N.push(1)}}

  EQ.pl.forEach(function(p,k){var v=EQ.sc[p.m+'|'+h],g=EQ.rcv==k?gs(EQ.H,hh,18):0;

/* distancias del hoyo de cada tee de la cancha, con su globito de color (ej. 🔵 380 · ⚪ 352 · 🔴 301) */
function ydL(h){var a=(EQ.yds||[]).filter(function(z){return z.y[h-1]!=null}).map(function(z){return(dot(z.t)||esc(z.t)+' ')+z.y[h-1]});

  var S='\u00a0\u00a0',nr=function(k,j){return j==i?(v[k]=='X'||v[k]=='99'):EQ.sc[EQ.pl[k].m+'|'+EQ.hs[j]]==='NR'},tx='Lag'+S+fh(lg);
  PR.forEach(function(q,k){var np=EQ.hs.some(function(x,j){return nr(q[0],j)&&nr(q[1],j)});tx+='<br>'+esc(EQ.pl[q[0]].a)+' | '+esc(EQ.pl[q[1]].a)+S+(np?'NPT':fh(t[k]))});

/* hoyo al que hay que ir: el primero sin cargar que sigue al último que se jugó (los equipos pueden salir por cualquier hoyo y dar la
   vuelta). Sin datos o con hoyos salteados, el primero que falta */
function faltaH(x){return!EQ.pl.every(function(p){return EQ.sc[p.m+'|'+EQ.hs[x]]!==undefined})}
function sigIdx(){if(EQ.mt){mExt();if(mEst().fin){var u=0;EQ.hs.forEach(function(h,j){if(EQ.pl.some(function(p){return EQ.sc[p.m+'|'+h]!==undefined}))u=j});return u}}
  var n=EQ.hs.length,tiene=function(x){return EQ.pl.some(function(p){return EQ.sc[p.m+'|'+EQ.hs[x]]!==undefined})},fin=[];
  for(var x=0;x<n;x++)if(tiene(x)&&!tiene((x+1)%n))fin.push(x);
  if(fin.length==1&&faltaH((fin[0]+1)%n))return(fin[0]+1)%n;
  for(var y=0;y<n;y++)if(faltaH(y))return y;
  return 0}
/* el hoyo se guarda en el celular y se manda por la cola: la pantalla avanza al instante, sin esperar al servidor */
function gd(){clearTimeout(T0);var i=EQ.i,h=EQ.hs[i],v=vals(),was=EQ.pl.every(function(p){return EQ.sc[p.m+'|'+h]!==undefined}),n=EQ.hs.length;
  EQ.pl.forEach(function(p,k){if(v[k])EQ.sc[p.m+'|'+h]=(v[k]=='X'||v[k]=='99')?'NR':+v[k]});
  cAdd(cur.f,EQ.id,EQ.cl,h,v);
  if(EQ.mt){mExt();n=EQ.hs.length;var me=mEst();if(me.fin){draw();msg('Match terminado: '+mTxt(me),'gr');return}}
  if(was){msg('Guardado','bl');return}
  var sig=-1;for(var k=1;k<=n;k++){var y=(i+k)%n;if(faltaH(y)){sig=y;break}}
  if(sig<0){draw();msg('Tarjeta Completa','gr');return}
  EQ.i=sig;draw();
  if(sig!=(i+1)%n)msg('Faltan cargar hoyos','rd')}

function editT(){run('adminTorneoEditar',[PINV,cur.f,{tee:$('et').value,rec:$('en').value,j:$('ej').value,r:$('er').value,pb:$('epb').value,g:$('eg').value,b1:$('e1').value,b3:$('e3').value,b4:$('e4').value,hs:$('eh').value}],function(){alert('Torneo actualizado');recargar()})}

/* ---- Admin: registro de cambios, cobros y respaldo ---- */
function modalErr(t,e){$('md').innerHTML='<div class="sup"><h3>'+t+'</h3><p>'+esc(e.message)+'</p><button class="pri" onclick="cerrarMd()">Cerrar</button></div>'}
function regV(){$('md').innerHTML='<div class="sup"><p class="m">Leyendo el registro…</p></div>';$('md').style.display='flex';
  run('adminRegistro',[PINV,cur.f],function(a){
    var s='<h3>Registro de cambios</h3><p class="m">Torneo del '+fdt(cur.f)+' · últimos movimientos, el más nuevo primero</p>';
    s+=a.length?a.map(function(x){return'<p class="m"><b>'+esc(x.t.slice(5,16))+'</b> · '+esc(x.q)+' · '+esc(x.a)+(x.d?'<br>'+esc(x.d):'')+'</p>'}).join(''):'<p class="m">Todavía no hay movimientos registrados.</p>';
    $('md').innerHTML='<div class="sup">'+s+'<button class="pri" onclick="cerrarMd()">Cerrar</button></div>'},function(e){modalErr('Registro de cambios',e)})}
function cobV(){$('md').innerHTML='<div class="sup"><p class="m">Leyendo los cobros…</p></div>';$('md').style.display='flex';
  run('adminCobros',[PINV,cur.f],function(d){CB=d;cobH()},function(e){modalErr('Cobros',e)})}
function cobH(){var d=CB,g=0,pr=0,pt=0,pm=0,ptm=0;
  d.j.forEach(function(p){if(p.gf)g++;if(p.premio){pt++;ptm+=p.premio;if(p.pr){pr++;pm+=p.premio}}});
  var s='<h3>Cobros</h3><p class="m">Torneo del '+fdt(cur.f)+' · green fee '+money(d.fee)+(d.e!='FINALIZADO'?' · los premios aparecen al finalizar el torneo':'')+'</p>'
   +'<p class="m"><b>Green fee:</b> '+g+' de '+d.j.length+' pagaron · cobrado '+money(g*d.fee)+' de '+money(d.j.length*d.fee)+'</p>'
   +(pt?'<p class="m"><b>Premios:</b> '+pr+' de '+pt+' pagados · '+money(pm)+' de '+money(ptm)+'</p>':'')
   +'<table><tr><th>Jugador</th><th>Green fee</th><th>Premio</th></tr>';
  d.j.forEach(function(p,i){s+='<tr><td>'+esc(p.a)+'<div class="m">'+esc(p.eq)+'</div></td><td><input type="checkbox" '+(p.gf?'checked ':'')+'onchange="cobT('+i+',\'gf\',this.checked)"></td><td>'
    +(p.premio?money(p.premio)+' <input type="checkbox" '+(p.pr?'checked ':'')+'onchange="cobT('+i+',\'pr\',this.checked)">':'—')+'</td></tr>'});
  $('md').innerHTML='<div class="sup">'+s+'</table><button class="pri" onclick="cerrarMd()">Cerrar</button></div>'}
function cobT(i,c,v){var p=CB.j[i];p[c]=v;
  run('adminCobro',[PINV,cur.f,p.m,c,v],function(){cobH()},function(e){p[c]=!v;alert(e.message);cobH()})}
function respV(){if(!confirm('¿Hacer un respaldo ahora? Puede tardar unos segundos.'))return;
  $('md').innerHTML='<div class="sup"><p class="m">Haciendo el respaldo…</p></div>';$('md').style.display='flex';
  run('adminRespaldo',[PINV],function(n){$('md').innerHTML='<div class="sup"><h3>Respaldo listo</h3><p class="m">'+esc(n)+'</p><button class="pri" onclick="cerrarMd()">Cerrar</button></div>'},function(e){modalErr('Respaldo',e)})}

/* ---- Admin ---- */
function recargar(){run('getInit',[],function(d){F=ordF(d.f);GF=d.gf||0;var s=$('f').value,c=F.filter(function(x){return x.f==s})[0]||F[F.length-1];cur=c;fillF(c.f);EQ=null;team();show(3)})}
function adm(){if($('sls'))SLSEL=$('sls').value;PINV=$('pin').value||PINV;$('al').innerHTML='<p class="m">Verificando…</p>';
  var er=function(e){$('al').innerHTML='<p class="m">'+esc(e.message)+'</p>'};
  run('adminEquipos',[PINV,cur.f],function(t){ADM=t;run('adminFechas',[PINV],function(tf){CA=tf.c||[];PIND=!!tf.pinDef;SLX=tf.sl||[];SLU=tf.url||'';admR(t,tf.f)},er)},er)}
function admR(t,tf){try{
  var s='<p class="m" style="text-align:right">Versión 16/10 aa</p>'+(PIND?'<div class="warn">⚠ Estás usando el PIN por defecto. Cambialo desde el editor de Apps Script: en la función setup escribí tu PIN en var pin = \'\' y ejecutala.</div>':'')
   +'<h3>Estado del torneo</h3><div class="r">'+['ABIERTO','ACTIVO','FINALIZADO'].map(function(e){return'<button class="'+(cur.e==e?'sel':'')+'" onclick="est2(\''+e+'\')">'+e.charAt(0)+e.slice(1).toLowerCase()+'</button>'}).join('')+'</div>'
   +'<p class="m">Abierto: se arman equipos. Activo: se juega, ya no se arman equipos. Finalizado: solo se ve el leaderboard y queda una foto fija de los resultados.</p>'

    return'<div class="r"><span><b>'+esc(x.id)+'</b>'+(b?' · de baja':'')+(x.pr&&!b?' · presentada':'')+'<div class="m">'+esc(x.j)+' <button class="c" onclick="ordenA(\''+q+'\')">Orden</button><button class="c" onclick="jugA(\''+q+'\')">Jugador</button>'+(x.pr&&!b&&cur.e!='FINALIZADO'?'<button class="c" onclick="habT(\''+q+'\')">Habilitar tarjeta</button>':'')+'</div></span>'
     +(b?'<span><button onclick="est(\''+q+'\',\'ACTIVO\')">Activar</button> <button class="bad" onclick="borrar(\''+q+'\')">Borrar</button></span>':'<button class="bad" onclick="est(\''+q+'\',\'BAJA\')">Dar de baja</button>')+'</div>'}).join(''):'<p class="m">No hay equipos en esta fecha.</p>';

    s+='<p class="m">Se puede cambiar el tee, los hoyos, los jugadores por equipo, si es restringido, el punto bonus, el green fee y las bolas mientras el torneo no tenga ningún equipo anotado.</p><div class="f"><select id="et">'+cn.t.map(function(x){return op(esc(x),dot(x)+esc(x),x==ce.tee)}).join('')+op('Mixto','Mixto (cada jugador elige)',ce.tee=='Mixto')+'</select>'
     +'<select id="en">'+[['18','18 hoyos'],['14','14 hoyos'],['ida','9 de ida'],['vuelta','9 de vuelta']].map(function(x){return op(x[0],x[1],x[0]==ce.rec)}).join('')+'</select>'
     +'<select id="ej">'+op('4','4 jugadores por equipo',ce.jpe!=3)+op('3','3 jugadores por equipo',ce.jpe==3)+'</select>'
     +'<select id="er">'+op('NO','Restringido: NO',!ce.r)+op('SI','Restringido: SI',!!ce.r)+'</select>'
     +'<select id="epb">'+op('NO','Punto bonus: NO',!ce.pb)+op('SI','Punto bonus: SI',!!ce.pb)+'</select>'
     +'<input id="eg" inputmode="numeric" placeholder="Green fee por jugador" value="'+esc(ce.gf||GF||'')+'">'
     +'<input id="e1" placeholder="Hoyos de 1 bola (ej. 2;5)" value="'+esc((ce.b1||[]).join(';'))+'">'
     +'<input id="e3" placeholder="Hoyos de 3 bolas (ej. 4;9;12)" value="'+esc((ce.b3||[]).join(';'))+'">'
     +'<input id="e4" placeholder="Hoyos de 4 bolas (ej. 7)" value="'+esc((ce.b4||[]).join(';'))+'">'
     +'<input id="eh" placeholder="Hoyos a jugar (solo si son 14, ej. 5 a 18)" value="'+esc(ce.rec=='14'?hsTxt(ce.hs):'')+'"><button class="pri" onclick="editT()">Guardar cambios</button></div>';
  }else s+='<p class="m">'+(t.length?'Este torneo ya tiene equipos anotados, así que no se puede cambiar. Para editarlo, dá de baja y borrá todos sus equipos.':'Solo se puede editar un torneo abierto o activo.')+'</p>';
  s+=slSec(tf);
  s+='<h3>Cobros</h3><p class="m">Marcá quién pagó el green fee y a quién ya se le pagó el premio.</p><button class="pri" onclick="cobV()">Ver cobros del torneo</button>';
  s+='<h3>Registro de cambios</h3><p class="m">Golpes corregidos, tarjetas presentadas y habilitadas, y los cambios del administrador.</p><button class="pri" onclick="regV()">Ver el registro</button>';
  s+='<h3>Respaldo</h3><p class="m">Cada día a las 3 de la mañana se hace una copia de la planilla en tu Drive (carpeta "Respaldos Laguneada", últimos 30 días).</p><button class="pri" style="background:#55665b" onclick="respV()">Hacer un respaldo ahora</button>';
  s+='<h3>Agregar torneo</h3><div class="f"><input id="nf" type="date"><select id="nn"><option value="18">18 hoyos</option><option value="14">14 hoyos</option><option value="ida">9 de ida</option><option value="vuelta">9 de vuelta</option></select><select id="nj"><option value="4">4 jugadores por equipo</option><option value="3">3 jugadores por equipo</option></select><select id="nr"><option value="NO">Restringido: NO</option><option value="SI">Restringido: SI</option></select><select id="npb"><option value="NO">Punto bonus: NO</option><option value="SI">Punto bonus: SI</option></select>'
   +'<select id="nc" onchange="nct()">'+CA.filter(function(c){return!c.rev&&!c.off}).map(function(c){return'<option value="'+esc(c.n)+'">'+esc(c.n)+'</option>'}).join('')+'</select><select id="nt"></select>'
   +'<input id="ng" inputmode="numeric" placeholder="Green fee por jugador'+(GF?' (actual '+money(GF)+')':'')+'">'
   +'<input id="n1" placeholder="Hoyos de 1 bola (ej. 2;5)"><input id="n3" placeholder="Hoyos de 3 bolas (ej. 4;9;12)"><input id="n4" placeholder="Hoyos de 4 bolas (ej. 7)"><input id="nh" placeholder="Hoyos a jugar (solo si son 14, ej. 5 a 18)"><button class="pri" onclick="nuevoT()">Agregar torneo</button></div>'
   +'<p class="m">Para que otra persona cree un torneo sin el PIN, mandale este link. Sirve para crear un solo torneo; después hay que pedir uno nuevo.</p><button class="pri" style="background:#55665b" onclick="linkT()">Link para crear torneo</button>'
   +'<h3>Agregar match</h3><p class="m">Uno contra uno, 18 hoyos. Neto: el de mayor index recibe el handicap del 85% de la diferencia de index en los hoyos de menor handicap.</p><div class="f"><input id="mf" type="date">'
   +'<select id="mc" onchange="mct()">'+CA.filter(function(c){return!c.rev&&!c.off}).map(function(c){return'<option value="'+esc(c.n)+'">'+esc(c.n)+'</option>'}).join('')+'</select><select id="mte"></select>'
   +'<select id="mmo"><option value="gross">Modalidad: Gross</option><option value="neto">Modalidad: Neto</option></select><button class="pri" onclick="nuevoM()">Agregar match</button></div>';
  s+='<h3>Torneos</h3>'+tf.map(function(x){var b=x.e=='BAJA';
    return'<div class="r"><span><b>'+fdt(x.f)+'</b> · '+(b?'de baja':x.e.toLowerCase())+'<div class="m">'+esc(x.cn||'')+' · '+(x.mt?'':recL(x.rec)+' · ')+dot(x.tee)+esc(x.tee||'')+'</div><div class="m">'+esc(detT(x))+'</div></span>'
     +(b?'<span><button onclick="tAct(\''+x.f+'\')">Activar</button> <button class="bad" onclick="tDel(\''+x.f+'\')">Borrar</button></span>':'<button class="bad" onclick="tBaja(\''+x.f+'\')">Dar de baja</button>')+'</div>'}).join('');
  s+='<h3>Canchas</h3>'+CA.map(function(c){var q=esc(c.n).replace(/'/g,"\\'");
    return'<div class="r"><span><b>'+esc(c.n)+'</b>'+(c.rev?' · <span style="color:#c23b2e;font-weight:700">pendiente de revisión</span>':c.off?' · <span class="m">deshabilitada</span>':'')+'<div class="m">'+(c.t.length?c.t.map(function(x){return dot(x)+esc(x)}).join(' · '):'sin rangos cargados')+'</div></span>'
     +(c.rev?'<button class="sel" onclick="cOk(\''+q+'\')">Ya la revisé</button>':c.off?'<span><button class="sel" onclick="cOn(\''+q+'\',true)">Habilitar</button></span>':'<span><button onclick="rgConf(\''+q+'\')">Cargar rangos</button> <button class="bad" onclick="cOn(\''+q+'\',false)">Deshabilitar</button></span>')+'</div>'}).join('')
   +'<h3>Agregar cancha desde internet</h3><p class="m">Toma de golfhandicapp.com los tees con calificación, slope y par (18 hoyos) y de hole19golf.com el par y el handicap de cada hoyo. Las distancias salen de hole19 y, si no están, de golfhandicapp. <b>Si la pestaña ya existe</b>, solo le carga las distancias (alcanza con una de las dos páginas). La cancha queda <b>pendiente de revisión</b>: hay que compararla con la tarjeta del club antes de usarla en un torneo.</p>'
   +'<div class="f"><input id="cw1" inputmode="numeric" placeholder="Código de golfhandicapp (ej. 316) o link de la cancha"><input id="cw2" placeholder="Cancha en hole19 (ej. jockey-club-de-rosario) o link"><input id="cw3" placeholder="Nombre de la pestaña (ej. Jockey Rosario)"><button class="pri" onclick="cWeb()">Agregar cancha</button></div>';

function est(id,e){run('adminEstado',[PINV,cur.f,id,e],adm)}
function est2(e){run('adminTorneo',[PINV,cur.f,e],recargar)}
/* detalle del torneo: jugadores por equipo, Restringido, Punto Bonus, modalidades de bolas y green fee */
function detT(x){if(x.mt)return'Modalidad '+(x.mod=='neto'?'Neto':'Gross');var p=[(x.jpe==3?3:4)+' jugadores por equipo'];if(x.r)p.push('Restringido');if(x.pb)p.push('Punto Bonus');
  [[1,x.b1],[3,x.b3],[4,x.b4]].forEach(function(b){if(b[1]&&b[1].length)p.push(b[0]+(b[0]==1?' bola: ':' bolas: ')+b[1].join(' '))});
  if(x.gf>0)p.push('Green fee '+money(x.gf));return p.join(' · ')}
/* match: los tees con rangos de 18 hoyos de la cancha elegida */
function mct(){if(!$('mc'))return;var c=CA.filter(function(x){return x.n==$('mc').value})[0];
  $('mte').innerHTML=(c&&c.t.length?c.t.filter(function(x){return c.b.indexOf(x)>=0}):[]).map(function(x){return'<option value="'+esc(x)+'">'+dot(x)+esc(x)+'</option>'}).join('')||'<option value="">(sin rangos cargados)</option>'}
function nuevoM(){if(!$('mf').value){alert('Elegí la fecha');return}if(!$('mte').value){alert('La cancha elegida no tiene rangos cargados.');return}
  run('adminMatchNuevo',[PINV,{f:$('mf').value,cancha:$('mc').value,tee:$('mte').value,mod:$('mmo').value}],function(r){alert('Match '+r.mt+' creado');recargar()})}
/* cancha bajada de internet: resumen para comparar con la tarjeta del club */
function cWeb(){var o={cod:$('cw1').value,h19:$('cw2').value,nom:$('cw3').value};if(!o.nom||(!o.cod&&!o.h19)){alert('Completá el nombre de la pestaña y al menos una de las dos páginas');return}
  $('md').innerHTML='<div><p class="m">Buscando la cancha en las dos páginas… puede tardar.</p></div>';$('md').style.display='flex';
  run('adminCanchaWeb',[PINV,o],function(r){
    if(r.soloYds){$('md').innerHTML='<div class="sup"><h3>Distancias cargadas en '+esc(r.nom)+'</h3><p class="m">Tees con distancias: <b>'+esc(r.ok.join(', ')||'ninguno')+'</b></p>'+(r.no.length?'<p class="m">Sin datos en las páginas: '+esc(r.no.join(', '))+'</p>':'')+'<p class="m">Revisalas en la pestaña '+esc(r.nom)+' (columnas U en adelante).</p><button class="pri" onclick="cerrarMd();adm()">Cerrar</button></div>';return}
    var s='<h3>Cancha '+esc(r.nom)+' creada</h3><p class="m" style="color:#c23b2e"><b>Queda pendiente de revisión.</b> Compará estos datos con la tarjeta del club. Si algo no coincide, corregilo en la pestaña '+esc(r.nom)+' del Drive. Después tocá <b>Ya la revisé</b> en Admin &gt; Canchas.</p>';
    if(r.avisos.length)s+=r.avisos.map(function(a){return'<p class="m">⚠ '+esc(a)+'</p>'}).join('');
    s+='<table><tr><th>Tee</th><th>Slope</th><th>Calif.</th><th>Par</th><th>Datos de</th></tr>'+r.tees.map(function(t){return'<tr><td>'+dot(t.n)+esc(t.n)+'</td><td>'+t.sl+'</td><td>'+t.cr+'</td><td>'+t.pa+'</td><td class="m">'+esc(t.src||'')+'</td></tr>'}).join('')+'</table>';
    s+='<table style="margin-top:8px"><tr><th>Hoyo</th><th>Par</th><th>Handicap</th>'+(r.parH&&r.parG?'<th>Par golfhandicapp</th>':'')+'</tr>';
    for(var i=0;i<18;i++){var d=r.parH&&r.parG&&r.parH[i]!=r.parG[i];s+='<tr'+(d?' style="background:#fdecea"':'')+'><td>'+(i+1)+'</td><td>'+(r.par?r.par[i]:'')+'</td><td>'+(r.hcp?r.hcp[i]:'')+'</td>'+(r.parH&&r.parG?'<td>'+r.parG[i]+'</td>':'')+'</tr>'}
    $('md').innerHTML='<div class="tj">'+s+'</table><button class="pri" onclick="cerrarMd();adm()">Cerrar</button></div>'},
    function(e){modalErr('Agregar cancha',e)})}
function cOn(n,on){if(!on&&!confirm('¿Deshabilitar '+n+'?\n\nNo va a aparecer para crear torneos ni match hasta que la vuelvas a habilitar. Los torneos que ya la usan siguen igual.'))return;
  run('adminCanchaOnOff',[PINV,n,on],function(){adm()},function(e){modalErr('Cancha',e)})}
function cOk(n){if(!confirm('¿Ya comparaste '+n+' con la tarjeta del club (slope, calificación, par y handicap de cada hoyo)?\n\nSe vuelven a cargar los rangos con los datos de la pestaña y la cancha queda habilitada para los torneos.'))return;
  run('adminCanchaOk',[PINV,n],function(r){alert('Cancha habilitada: '+r);adm()},function(e){modalErr('Cancha',e)})}
function tdSor(){if(!confirm('¿Habilitar el sorteo del '+fdt(cur.f)+'? Si ya había equipos sorteados se borran (no los que ya cargaste en el torneo).'))return;
  run('adminTdSorteo',[PINV,cur.f],function(){alert('Listo: en el link de inscripción del '+fdt(cur.f)+' el botón Sortear quedó habilitado.')})}
function tdAct(){run('adminTdActualizar',[PINV,cur.f],function(r){
  var s='<h3>Torneo actualizado</h3>'+(r.ok.length?'<p class="m">Equipos cargados ('+r.ok.length+'):</p>'+r.ok.map(function(x){return'<p class="m"><b>'+esc(x)+'</b></p>'}).join(''):'<p class="m">No había equipos nuevos para cargar.</p>')
   +(r.mal.length?'<p class="m" style="color:#8a1f14">No se cargaron:</p>'+r.mal.map(function(x){return'<p class="m">'+esc(x)+'</p>'}).join(''):'');
  $('md').innerHTML='<div class="sup">'+s+'<button class="pri" onclick="cerrarMd();recargar()">Cerrar</button></div>';$('md').style.display='flex'},function(e){modalErr('Actualizar torneo',e)})}
/* link de inscripción al torneo elegido arriba (Torneo Diario) */
function linkTD(){run('adminTdLink',[PINV,cur.f],function(){},function(){});cur.td=true;
  if(!SLU){alert('No pude obtener el link del sistema. Es el mismo que usás para entrar, agregando ?ti='+cur.f+' al final.');return}
  var u=SLU+(SLU.indexOf('?')<0?'?':'&')+'ti='+cur.f;

/* link de un solo uso para que otra persona cree un torneo sin PIN */
function linkT(){run('adminLinkTorneo',[PINV],function(r){
  if(!r.url){alert('No pude obtener el link del sistema. Es el mismo que usás para entrar, agregando ?nt='+r.tok+' al final.');return}
  $('md').innerHTML='<div><h3>Link para crear torneo</h3><p class="m">Sirve para crear un solo torneo. Quien lo use no necesita el PIN y, después de crearlo, solo va a poder finalizarlo.</p><textarea id="ntl" readonly style="height:90px">'+esc(r.url)+'</textarea><button class="pri" onclick="copiarTxt(\'ntl\')">Copiar</button><button class="pri" style="background:#55665b" onclick="cerrarMd()">Cerrar</button></div>';$('md').style.display='flex'})}
function nuevoT(){if(!$('nt').value){alert('La cancha elegida no tiene rangos cargados. Usá "Cargar rangos" en la sección Canchas.');return}
  run('adminTorneoNuevo',[PINV,{f:$('nf').value,rec:$('nn').value,j:$('nj').value,r:$('nr').value,pb:$('npb').value,cancha:$('nc').value,tee:$('nt').value,g:$('ng').value,b1:$('n1').value,b3:$('n3').value,b4:$('n4').value,hs:$('nh').value}],function(){alert('Torneo agregado');recargar()})}
</script></body></html>
